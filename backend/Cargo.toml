[package]
name = "backend"
version = "0.1.3-beta"
edition = "2024"
rust-version = "1.94"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "json"] }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "v5"] }
clap = { version = "4.5", features = ["derive"] }
# SQLx/CDK upgrades must be coordinated: see docs/DEPENDENCY_UPDATES.md.
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "macros", "chrono", "uuid", "postgres", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bdk = { version = "0.30.2", default-features = false, features = ["keys-bip39", "std", "use-esplora-ureq", "electrum"] }
electrum-client = "0.18"
thiserror = "2.0.21"
urlencoding = "2.1"
async-trait = "0.1"
cdk = "0.16"
cdk-sqlite = "0.16"
rand = "0.8"
prometheus-client = "0.22"
serde_cbor = "0.11"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

[patch.crates-io]
sqlx-sqlite = { path = "../vendor/sqlx-sqlite-0.7.4" }
